spring.application.name=simulador

server.port=${SERVER_PORT:8090}
mqtt.broker.url=${MQTT_BROKER_URL:tcp://localhost:1883}
mqtt.client.id=${MQTT_CLIENT_ID:simulador-client}
mqtt.connection-timeout=${MQTT_CONNECTION_TIMEOUT:10}
mqtt.keep-alive-interval=${MQTT_KEEP_ALIVE_INTERVAL:20}
mqtt.clean-session=${MQTT_CLEAN_SESSION:true}
mqtt.topic_command=sensor/%s/commands
mqtt.topic.default=sensor/{deviceId}/telemetry
mqtt.topic.fragments.blood=sensor/{deviceId}/blood
mqtt.topic.fragments.electrolyte=sensor/{deviceId}/electrolyte
mqtt.topic.fragments.lipid=sensor/{deviceId}/lipid
mqtt.topic.fragments.metabolic=sensor/{deviceId}/metabolic

management.endpoints.web.exposure.include=health,info,metrics,env
management.endpoint.health.show-details=always
management.endpoint.metrics.enabled=true

spring.web.error.include-message=always
spring.web.error.include-binding-errors=always
spring.web.error.include-exception=true
spring.web.error.include-stacktrace=on_param

logging.level.pro.ms.simulador=ERROR
logging.level.org.springframework.web=ERROR